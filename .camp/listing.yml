name: Conference Program
summary: 'Conference Program is a Moodle activity that peer-reviews Conference Submissions proposals with a rubric (optionally blind), records decisions and publishes the accepted programme.'
description: |
  Conference Program takes the proposals collected by a Conference Submissions
  activity (`mod_confsubmissions`) through peer review, then publishes the
  accepted sessions to attendees. It is part of the Conference Tools suite,
  with Conference Submissions, Conference Scheduler and Conference Check-in.

  **Review phase**

  - Assign individual reviewers, or a course group of reviewers in group-review
    mode, with a track filter and a per-round review limit for each reviewer.
  - Reviewers score each abstract with a rubric from Moodle's advanced grading.
  - Optional blind review: reviewers do not see the speakers or custom fields,
    and presenters do not see reviewer names. Only managers see identities by
    default (`mod/confprogram:viewidentity`).
  - Mark invited keynotes or panels as unvetted to keep them out of review.
  - A Decision report with each reviewer's score, track and decision filters,
    and Accept / Reject / Waitlist / Resubmit row by row or in bulk.
  - Resubmit gives the presenter the reviewers' feedback at once; a Start a new
    round link reassigns the resubmitted proposals.

  **Decisions stay private until you publish.** Accept, reject and waitlist
  decisions stay off presenters' pages until the organiser switches to the
  Display phase, and their notifications go out only when the organiser sends
  them. Decision notifications are off until turned on, use editable templates
  per decision type and, except for Resubmit (sent at once), wait in a queue
  the organiser can review before sending.

  **Display phase:** the accepted sessions with track, speakers and, from
  Conference Scheduler, day, time and room; a day selector, a favourites filter
  and a detail window. Favourites are shared with Conference Scheduler's My
  timetable. The organiser chooses which fields appear in the list and in the
  detail window.

  Backup and restore (the rubric and settings always; reviews and decisions
  with user data) and course reset are supported, and the privacy API covers
  export and deletion. Requires Moodle
  5.2 or 5.3 and `mod_confsubmissions`. No external service or account is used.
labels:
  # Required disclosure labels — pick all that apply (RFC §4.7):
  #   fully-free | freemium | paid-service | external-account
  #   donation-supported | commercial-support-available
  - fully-free
