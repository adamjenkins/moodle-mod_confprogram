name: mod_confprogram
summary: 'Conference Program — a Moodle activity that takes submissions from mod_confsubmissions through a reviewer workflow, then publishes the accepted programme.'
description: |
  Takes submissions from `mod_confsubmissions` through a reviewer workflow:
  rubric-based review on Moodle's advanced grading API (optionally blind, with
  identities hidden in both directions), individual or group reviewer
  assignment, unvetted keynotes/panels, and bulk Accept / Reject / Resubmit /
  Waitlist decisions on a filterable report — then publishes the accepted
  programme. Part of the Conference Tools suite.
labels:
